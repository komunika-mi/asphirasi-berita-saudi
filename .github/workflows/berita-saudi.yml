name: Berita Saudi ASPHIRASI

# Tiap putaran menulis DRAFT ke Sanity untuk dua jalur:
# - Saudi: paling banyak 5 per putaran, jatah harian 20 (kategori Saudi Update).
# - Regulasi (sejak 9 Okt 2026): paling banyak 2 per putaran, jatah harian 4,
#   dari siaran pers Kemenhaj dan E-Media DPR (kategori Regulasi).
# Tidak ada yang tayang otomatis: editor ASPHIRASI yang menekan Publish.
#
# Draft ditulis TANPA sampul. z_image hanya jalan lewat CLI Higgsfield yang
# login di laptop (login lewat browser, token berumur pendek; API Higgsfield
# Cloud tidak memuat z_image), jadi putaran ini meninggalkan pesanan sampul
# yang dikerjakan Task Scheduler laptop "ASPHIRASI - Sampul berita Saudi".
#
# Menit 23 dan 53, bukan 0: menit 0 menit tersibuk GitHub Actions dan event
# schedule paling sering dijatuhkan di sana (terukur di repo The Signal).
# Dua slot per jam karena GitHub tetap menjatuhkan sebagian besar slot: malam
# 14 Sep 2026 hanya 2 dari sekitar 13 slot per jam yang benar-benar jalan.
# Slot tambahan tidak menambah draft di atas jatah harian; putaran yang tidak
# menemukan kandidat baru berhenti sebelum menulis.
# 23 UTC = 06.xx WIB, 0-15 UTC = 07.xx-22.xx WIB.
on:
  schedule:
    - cron: "23,53 23,0-15 * * *"
  workflow_dispatch:
    inputs:
      kering:
        description: "Uji kering (tanpa menulis ke Sanity)"
        type: boolean
        default: true
      maks:
        description: "Maksimal artikel per jalur putaran ini"
        default: "1"
      jalur:
        description: "Jalur: regulasi, saudi, atau keduanya dipisah koma"
        default: "regulasi,saudi"

concurrency:
  group: berita-saudi
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Jalur untuk putaran terjadwal. Regulasi baru ikut setelah uji kering
  # pertamanya diperiksa (9 Okt 2026).
  JALUR_TERJADWAL: "saudi"

jobs:
  putaran:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Uji pengaman
        run: npm run uji

      - name: Putaran
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SAMPUL: laptop
          MAKS_PER_PUTARAN: "5"
          MAKS_REGULASI_PER_PUTARAN: "2"
          MAKS_REGULASI_PER_HARI: "4"
          # 5 + 2 naskah x ~3 menit (termasuk tulis ulang) masuk di 25 menit;
          # lewat batas, putaran berhenti memulai naskah baru dan tetap menyimpan.
          MENIT: "25"
        run: |
          ARGS="--jalur $JALUR_TERJADWAL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--jalur ${{ inputs.jalur }} --maks ${{ inputs.maks }}"
            [ "${{ inputs.kering }}" = "true" ] && ARGS="$ARGS --kering"
          fi
          node src/jalankan.mjs $ARGS

      # Uji kering menyimpan naskahnya di keluaran/ supaya bisa dibaca sebelum
      # jalur baru dinyalakan di jadwal.
      - name: Simpan naskah uji kering
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.kering }}
        uses: actions/upload-artifact@v4
        with:
          name: naskah-uji-kering
          path: keluaran/
          retention-days: 7
          if-no-files-found: ignore
